# .github/workflows/oracle-ci.yml
# AXIOLEDGER — VPX Oracle Node CI
#
# Triggers: push to main, pull_request to main
#
# Required GitHub Secrets:
#   (none required for CI — deploy is manual)

name: Oracle Node CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "24"

jobs:
  # ─── Security gate ─────────────────────────────────────────────────────────
  security-scan:
    name: "Security Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before || 'HEAD~1' }}
          head: ${{ github.sha }}
          extra_args: --only-verified

  # ─── Lint & test ───────────────────────────────────────────────────────────
  lint-test:
    name: "Lint & Test"
    runs-on: ubuntu-latest
    needs: security-scan
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "⚙️  Setup Node.js ${{ env.NODE_VERSION }}"
        uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: "npm"

      - name: "📦 Install dependencies"
        run: npm ci --ignore-scripts

      - name: "🔍 ESLint"
        run: npm run lint || true

      - name: "🧪 Jest tests"
        run: npm run test:ci
        env:
          # No real keys in CI — tests use mocks
          RPC_URL: "http://localhost:8545"
          VPX_ORACLE_CONTRACT: "0x0000000000000000000000000000000000000000"
          LOG_LEVEL: "silent"

      - name: "📤 Upload coverage"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 7
